services:
  - type: web
    name: pro-scanner-uat
    runtime: static
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: .
    autoDeployTrigger: commit
    headers:
      - path: /tailwind.min.css
        name: Cache-Control
        value: public, max-age=3600, stale-while-revalidate=86400
      - path: /
        name: Cache-Control
        value: no-store, no-cache, must-revalidate, max-age=0
      - path: /
        name: Pragma
        value: no-cache
      - path: /
        name: Expires
        value: "0"
      - path: /index.html
        name: Cache-Control
        value: no-store, no-cache, must-revalidate, max-age=0
      - path: /index.html
        name: Pragma
        value: no-cache
      - path: /index.html
        name: Expires
        value: "0"
